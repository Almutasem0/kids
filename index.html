<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>أنواع الخطوط</title>
<style>
:root{--bg:#fffdf8;--ink:#202633;--muted:#667085;--teal:#169b8f;--coral:#ea6a5a;--purple:#7968d9;--blue:#4a83cc;--green:#51a971;--yellow:#eab33a}*{box-sizing:border-box}body{margin:0;background:linear-gradient(160deg,#fffdf8,#f8fbff);font-family:Arial,"Tahoma",sans-serif;color:var(--ink)}#app{min-height:100svh;max-width:700px;margin-inline:auto;display:flex;flex-direction:column;padding-bottom:calc(84px + env(safe-area-inset-bottom))}.screen{display:none;min-height:100svh;padding:22px 16px 84px;max-width:700px;margin:auto;width:100%}.screen.active{display:block}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.pill{display:inline-block;padding:7px 12px;border-radius:999px;background:#eef8f6;color:var(--teal);font-weight:700;font-size:12px}.title{font-size:30px;line-height:1.2;margin:24px 0 8px;text-align:center}.sub{text-align:center;color:var(--muted);line-height:1.65;font-size:15px}.hero{background:#fff;border:1px solid #e3e7ee;border-radius:28px;padding:20px;box-shadow:0 10px 30px #23304412}.lines{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:28px 0}.linecard{background:#fff;border:1px solid #e4e7ee;border-radius:22px;padding:12px;text-align:center;box-shadow:0 8px 22px #2330440e}.linecard svg{width:100%;height:70px}.linecard b{display:block;margin-top:4px}.btn{width:100%;border:0;border-radius:17px;padding:15px 14px;font-size:16px;font-weight:800;margin:8px 0;cursor:pointer}.primary{background:var(--ink);color:#fff}.light{background:#fff;color:var(--ink);border:1px solid #e1e6ef}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.card{background:#fff;border:1px solid #e2e7ee;border-radius:20px;padding:16px;min-height:115px;box-shadow:0 8px 22px #2330440c}.card h3{margin:0 0 8px;font-size:17px}.card p{margin:0;color:var(--muted);line-height:1.55;font-size:13px}.bigline{background:#fff;border:1px solid #e2e7ee;border-radius:25px;padding:20px;margin:22px 0}.bigline svg{display:block;width:100%;height:180px}.bigline.examples{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.bigline.examples svg{height:auto;aspect-ratio:11/6}.quizOpt{background:#fff;border:2px solid #e2e7ee;border-radius:18px;padding:16px;margin:10px 0;font-weight:800;font-size:16px}.quizOpt.correct{border-color:var(--green);background:#eaf8ef}.quizOpt.wrong{border-color:var(--coral);background:#fff0ed}.feedback{text-align:center;border-radius:18px;padding:14px;font-weight:800;margin:12px 0;display:none}.feedback.show{display:block}.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;backdrop-filter:blur(12px);border-top:1px solid #e2e7ee;padding:10px max(12px,env(safe-area-inset-left)) calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px;justify-content:center}.nav button{flex:1;max-width:200px;border:0;background:#f1f3f7;padding:12px;border-radius:14px;font-weight:800}.brushes{display:flex;gap:12px;justify-content:center;margin:12px 0}.brush{width:48px;height:48px;min-height:48px;border:3px solid #fff;border-radius:50%;box-shadow:0 0 0 1px #cfd5df;cursor:pointer}.brush.active{box-shadow:0 0 0 3px var(--ink)}.brush:focus-visible{outline:3px solid var(--blue);outline-offset:4px}
@media(min-width:600px){.screen{padding-top:30px}.title{font-size:38px}.btn{max-width:560px;margin-left:auto;margin-right:auto}}
</style>
<div id="app"></div><div class="nav"><button onclick="go(home())">⌂ الرئيسية</button><button onclick="back()">السابق</button><button onclick="next()">التالي</button></div>
<script>
const A=document.getElementById('app');let idx=0;const reflections={name:'',className:'',answer:''};
const data=[
['cover',`<div class="pill">أ:عائشة المعمري • الفنون البصرية • مشروع رقمي </div><div class="title">أنواع الخطوط</div><p class="sub">اكتشف • جرّب • ارسم</p><div class="bigline examples">${svg('straight','teal')}${svg('curved','coral')}${svg('broken','purple')}${svg('wavy','blue')}${svg('spiral','yellow')}${svg('slanted','green')}</div><button class="btn primary" onclick="go(1)">ابدأ الاستكشاف ✨</button>`],
['home',`<div class="title">لوحة الانطلاق</div><p class="sub">اختر أي جزء واضغط عليه</p><div class="grid2">${card('تعرّف على الخط','فكرة سريعة عن الخط وأنواعه',3)}${card('معرض أنواع الخطوط','شاهد 6 أنواع واضغط على أي نوع',4)}${card('أين نراه؟','اكتشف الخطوط في الطبيعة والحياة',11)}${card('الألعاب','3 تحديات قصيرة',12)}${card('تحدي الفنان','ارسم ثم خمّن مع زميلك',16)}${card('ورشة الرسم','تتبّع ثم ابتكر رسمة',17)}</div>`],
['goal',`<div class="title">أهداف المشروع</div><p class="sub">نتعلم من خلال المشاهدة واللعب والرسم</p><div class="card"><h3>أتعرف</h3><p>أسماء الخطوط الأساسية.</p></div><div class="card"><h3>أميز</h3><p>شكل كل خط بدقة.</p></div><div class="card"><h3>أرسم</h3><p>الخطوط بطرق متنوعة.</p></div><div class="card"><h3>ألعب</h3><p>وأطبق ما تعلمته.</p></div>`],
['what',`<div class="title">ما هو الخط؟</div><p class="sub">الخط عنصر بصري نستخدمه في الرسم لتحديد الشكل والاتجاه والحركة.</p><div class="hero"><h3>يمكن أن يكون الخط…</h3><p>مستقيم • منحني • منكسر • مموج • لولبي • مائل</p></div><div class="bigline examples">${svg('straight','teal')}${svg('curved','coral')}${svg('broken','purple')}${svg('wavy','blue')}</div>`],
['gallery',`<div class="title">معرض أنواع الخطوط</div><p class="sub">اضغط على النوع الذي تريد اكتشافه</p><div class="lines">${lc('مستقيم','straight',3,'teal')}${lc('منحني','curved',4,'coral')}${lc('منكسر','broken',5,'purple')}${lc('مموج','wavy',6,'blue')}${lc('لولبي','spiral',7,'yellow')}${lc('مائل','slanted',8,'green')}</div>`],
...detail('المستقيم','straight','teal','خط يسير في اتجاه واضح دون انحناء.','طريق • قلم • حافة كتاب'),...detail('المنحني','curved','coral','خط يتغير اتجاهه بانسيابية وليونة.','قوس قزح • غيمة • قوس'),...detail('المنكسر','broken','purple','يتكون من أجزاء مستقيمة تلتقي بزوايا.','قمم الجبال • البرق'),...detail('المموج','wavy','blue','يصعد وينخفض في حركة تشبه الموج.','موج البحر • الدخان'),...detail('اللولبي','spiral','yellow','يدور حول نفسه تدريجيًا.','صدفة • دوامة'),...detail('المائل','slanted','green','يميل عن الاتجاه الأفقي أو العمودي.','منحدر • سلم'),
['env',`<div class="title">الخط في الأشياء من حولنا</div><p class="sub">ابحث عن الخطوط في الطبيعة والأشياء اليومية</p><div class="grid2">${ec('طريق','خط مستقيم','straight','teal')}${ec('قوس قزح','خط منحني','curved','coral')}${ec('جبال','خط منكسر','broken','purple')}${ec('موج البحر','خط مموج','wavy','blue')}${ec('جذع الشجرة','خط عمودي','straight','green')}${ec('بالون','خط دائري','curved','yellow')}</div>`],
['games',`<div class="title">الألعاب التفاعلية</div><p class="sub">اختر لعبة وابدأ التحدي</p><button class="btn light" onclick="go(13)">1) طابق الاسم مع الشكل</button><button class="btn light" onclick="go(14)">2) ابحث عن الخط المطابق</button><button class="btn light" onclick="go(15)">3) اختبار سريع</button>`],
['game1',`<div class="title">اللعبة 1 🎮</div><p class="sub">أي نوع من الخطوط تراه؟</p><div class="bigline">${svg('wavy','blue')}</div><div id="fb1" class="feedback"></div><div class="quizOpt" onclick="answer(this,true,'fb1','أحسنت! هذا خط مموج 🎉')">مموج</div><div class="quizOpt" onclick="answer(this,false,'fb1','حاول مرة أخرى 😊')">مستقيم</div><div class="quizOpt" onclick="answer(this,false,'fb1','حاول مرة أخرى 😊')">منكسر</div>`],
['game2',`<div class="title">اللعبة 2 🧩</div><p class="sub">اختر الشكل الذي يطابق كلمة «منكسر»</p><div id="fb2" class="feedback"></div><div class="grid2"><div class="quizOpt" onclick="answer(this,false,'fb2','ليس هذا الشكل')">${svg('curved','coral')}منحني</div><div class="quizOpt" onclick="answer(this,true,'fb2','صحيح! الخط المنكسر له زوايا 🎉')">${svg('broken','purple')}منكسر</div><div class="quizOpt" onclick="answer(this,false,'fb2','ليس هذا الشكل')">${svg('straight','teal')}مستقيم</div><div class="quizOpt" onclick="answer(this,false,'fb2','ليس هذا الشكل')">${svg('wavy','blue')}مموج</div></div>`],
['quiz',`<div class="title">اللعبة 3 ⭐</div><p class="sub">أي خط يشبه الموج؟</p><div id="fb3" class="feedback"></div><div class="quizOpt" onclick="answer(this,false,'fb3','فكر في البحر 🌊')">مائل</div><div class="quizOpt" onclick="answer(this,true,'fb3','إجابة صحيحة! 🌊')">مموج</div><div class="quizOpt" onclick="answer(this,false,'fb3','فكر في البحر 🌊')">لولبي</div>`],
['challenge',`<div class="title">تحدي الفنان الصغير 🎨</div><p class="sub">ارسم ثم اجعل زميلك يخمّن</p><div class="card"><h3>1</h3><p>اختر بطاقة خط.</p></div><div class="card"><h3>2</h3><p>ارسمه في الهواء.</p></div><div class="card"><h3>3</h3><p>ارسمه على الورق.</p></div><div class="card"><h3>4</h3><p>دع زميلك يخمّن.</p></div>`],
['workshop',`<div class="title">ورشة الرسم ✏️</div><p class="sub">تتبّع الخطوط أولًا، ثم ابتكر رسمة صغيرة.</p><div class="paper">${svg('straight','teal')}<p>ارسم هنا</p></div><div class="paper">${svg('curved','coral')}<p>ارسم هنا</p></div><div class="paper">${svg('broken','purple')}<p>ارسم هنا</p></div><div class="paper">${svg('wavy','blue')}<p>جرّب الرسم بإصبعك داخل المربع 👇</p><div class="brushes"><button type="button" class="brush active" data-brush="#202633" aria-label="قلم أسود" title="أسود" style="background:#202633" onclick="setBrushColor('#202633')"></button><button type="button" class="brush" data-brush="#ea6a5a" aria-label="قلم أحمر" title="أحمر" style="background:#ea6a5a" onclick="setBrushColor('#ea6a5a')"></button><button type="button" class="brush" data-brush="#169b8f" aria-label="قلم أخضر مزرق" title="أخضر" style="background:#169b8f" onclick="setBrushColor('#169b8f')"></button><button type="button" class="brush" data-brush="#4a83cc" aria-label="قلم أزرق" title="أزرق" style="background:#4a83cc" onclick="setBrushColor('#4a83cc')"></button></div><canvas id="draw" width="600" height="260" aria-label="مساحة الرسم. ارسم بإصبعك هنا." style="width:100%;height:260px;border:2px dashed #cfd5df;border-radius:16px;background:#fff;touch-action:none"></canvas><button class="btn light" onclick="clearCanvas()">مسح الرسم</button></div><button class="btn primary" onclick="go(18)">أنهيت! ⭐</button>`],
['end',`<div class="title">أحسنت يا فنان! 🌟</div><p class="sub">ماذا تعلمت اليوم؟</p><div class="card"><h3>أتعرف</h3><p>أسماء الخطوط.</p></div><div class="card"><h3>أميز</h3><p>أشكالها واتجاهاتها.</p></div><div class="card"><h3>أرسم</h3><p>خطوطًا متنوعة في عمل فني.</p></div><div class="hero"><label class="form-field" for="student-name">اسم الطالب</label><input id="student-name" type="text" autocomplete="name" placeholder="اكتب اسمك هنا" style="display:block;width:100%;margin-top:7px;padding:13px 14px;border:2px solid #dfe5ed;border-radius:12px;background:#fff;color:#202633;font:inherit;font-size:16px;line-height:1.5"><label class="form-field" for="student-class">الصف</label><input id="student-class" type="text" autocomplete="off" placeholder="اكتب صفك هنا" style="display:block;width:100%;margin-top:7px;padding:13px 14px;border:2px solid #dfe5ed;border-radius:12px;background:#fff;color:#202633;font:inherit;font-size:16px;line-height:1.5"><label class="form-field" for="student-answer">ماذا تعلمت اليوم؟</label><textarea id="student-answer" placeholder="اكتب إجابتك هنا" style="display:block;width:100%;min-height:110px;resize:vertical;margin-top:7px;padding:13px 14px;border:2px solid #dfe5ed;border-radius:12px;background:#fff;color:#202633;font:inherit;font-size:16px;line-height:1.5"></textarea><button class="btn primary" type="button" onclick="showPraise()">اعرض رسالتي ⭐</button></div><button class="btn light" onclick="go(0)">العودة إلى البداية</button>`]
];
function card(t,b,i){return `<button class="card" style="text-align:right;width:100%;border:0" onclick="go(${i})"><h3>${t}</h3><p>${b}</p></button>`}
function lc(t,k,i,c){return `<button class="linecard" onclick="go(${i})" style="border:0;color:inherit">${svg(k,c)}<b>${t}</b></button>`}
function ec(a,b,k,c){return `<div class="card"><h3>${a}</h3><p>${b}</p>${svg(k,c)}</div>`}
function detail(t,k,c,d,u){return [['detail',`<div class="title">${t}</div><p class="sub">${d}</p><div class="bigline">${svg(k,c)}</div><div class="card"><h3>أين نراه؟</h3><p>${u}</p></div>`]]}
function svg(kind,c){const Cc=getComputedStyle(document.documentElement).getPropertyValue('--'+c).trim();let d='M10 55 L190 55';if(kind==='curved')d='M10 65 Q95 5 190 65';if(kind==='broken')d='M10 70 L55 20 L100 70 L145 15 L190 70';if(kind==='wavy')d='M10 55 C35 5 60 105 85 55 S135 5 160 55 S185 105 210 55';if(kind==='slanted')d='M30 78 L185 18';if(kind==='spiral')d='M185 25 C130 5 30 10 25 65 C20 115 145 125 155 75 C160 35 75 30 70 65 C65 95 120 95 120 65 C120 50 98 48 94 62';return `<svg viewBox="0 0 220 120" xmlns="http://www.w3.org/2000/svg"><path d="${d}" fill="none" stroke="${Cc||'#169b8f'}" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/></svg>`}
function answer(el,ok,id,msg){document.querySelectorAll('.quizOpt').forEach(x=>{x.classList.remove('correct','wrong');x.setAttribute('aria-pressed','false')});el.classList.add(ok?'correct':'wrong');el.setAttribute('aria-pressed','true');const f=document.getElementById(id);f.textContent=msg;f.className='feedback show';f.setAttribute('aria-live','polite');f.style.background=ok?'#eaf8ef':'#fff0ed';f.style.color=ok?'#2f7f50':'#a64337'}
function initCanvas(){const c=document.getElementById('draw');if(!c)return;const ctx=c.getContext('2d');ctx.lineWidth=7;ctx.lineCap='round';ctx.strokeStyle='#202633';let down=false;function pos(e){const r=c.getBoundingClientRect();return {x:(e.clientX-r.left)*c.width/r.width,y:(e.clientY-r.top)*c.height/r.height}}function start(e){down=true;c.setPointerCapture(e.pointerId);const p=pos(e);ctx.beginPath();ctx.moveTo(p.x,p.y);e.preventDefault()}function move(e){if(!down)return;const p=pos(e);ctx.lineTo(p.x,p.y);ctx.stroke();e.preventDefault()}function end(e){down=false;if(c.hasPointerCapture(e.pointerId))c.releasePointerCapture(e.pointerId)}c.addEventListener('pointerdown',start);c.addEventListener('pointermove',move);c.addEventListener('pointerup',end);c.addEventListener('pointercancel',end);c.addEventListener('lostpointercapture',()=>{down=false})}
function setBrushColor(color){const c=document.getElementById('draw');if(!c)return;c.getContext('2d').strokeStyle=color;document.querySelectorAll('.brush').forEach(b=>b.classList.toggle('active',b.dataset.brush===color))}
function clearCanvas(){const c=document.getElementById('draw');if(c)c.getContext('2d').clearRect(0,0,c.width,c.height)}
function render(){A.innerHTML=data[idx][1];document.title=data[idx][0]==='cover'?'أنواع الخطوط':'أنواع الخطوط • مشروع تفاعلي';document.querySelectorAll('.quizOpt').forEach(option=>{option.setAttribute('role','button');option.setAttribute('tabindex','0');option.setAttribute('aria-pressed','false');option.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();option.click()}})});const navButtons=document.querySelectorAll('.nav button');navButtons[1].disabled=idx===0;navButtons[2].disabled=idx===data.length-1;if(idx===18){const praise=document.createElement('div');praise.id='praise';praise.setAttribute('role','status');praise.setAttribute('aria-live','polite');praise.hidden=true;praise.style.cssText='margin:12px 0;padding:14px 16px;border-radius:14px;background:#eaf8ef;color:#2f7f50;font-size:17px;font-weight:800;line-height:1.6;text-align:center;overflow-wrap:anywhere';A.querySelector('.title').after(praise);const fields=[['student-name','name'],['student-class','className'],['student-answer','answer']];fields.forEach(([id,key])=>{const field=document.getElementById(id);field.value=reflections[key];field.addEventListener('input',()=>{reflections[key]=field.value})})}
window.scrollTo(0,0);initCanvas()}
function showPraise(){const missing=[['student-name','الاسم'],['student-class','الصف'],['student-answer','الإجابة']].find(([id])=>!document.getElementById(id).value.trim());const praise=document.getElementById('praise');if(missing){praise.textContent=`اكتب ${missing[1]} أولا، ثم اضغط الزر.`;praise.hidden=false;document.getElementById(missing[0]).focus();return}praise.textContent=`ممتاز يا ${reflections.name.trim()}! صفك: ${reflections.className.trim()}، تعلمت: ${reflections.answer.trim()}`;praise.hidden=false;praise.scrollIntoView({behavior:'smooth',block:'center'})}
function go(i){idx=Math.max(0,Math.min(data.length-1,i));render()}function next(){go(idx+1)}function back(){go(idx-1)}function home(){return 1}
render();
</script></html>
